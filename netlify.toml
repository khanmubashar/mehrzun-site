# Netlify: builds the Next.js static export and serves ./out from the site root.
[build]
  command = "npm run build"
  publish = "out"

[functions]
  # submission-created.ts runs after each verified Netlify Forms submission and sends emails via Gmail
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  # Served from the domain root on Netlify, so no base path.
  NEXT_PUBLIC_BASE_PATH = ""

# Long cache for hashed build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
